<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Production Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>AI Video Production Planner</h1>
      <p>Enter text, a topic, or PDF content and get a complete video plan.</p>
    </header>

    <main>
      <form id="planner-form">
        <label for="inputType">Input type</label>
        <select id="inputType" name="inputType">
          <option value="topic">Topic / Title</option>
          <option value="text">Raw Text</option>
          <option value="pdf">Extracted PDF Text</option>
        </select>

        <label for="sourceInput">Your content</label>
        <textarea id="sourceInput" name="sourceInput" placeholder="Type your text, topic, or PDF content here..." required></textarea>

        <button type="submit">Generate Video Plan</button>
      </form>

      <section id="output" class="output hidden">
        <h2>Generated Video Plan</h2>
        <pre id="planText"></pre>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
